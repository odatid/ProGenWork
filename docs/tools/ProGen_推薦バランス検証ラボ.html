<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProGen 推薦バランス検証ラボ</title>
<style>body{margin:0;background:#101827;color:#edf4ff;font-family:system-ui,'Yu Gothic',sans-serif}main{max-width:1080px;margin:auto;padding:28px}h1{margin:0 0 8px}p{color:#b9c9de}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#182337;border:1px solid #31435e;border-radius:16px;padding:18px}.ok{color:#58e1b7}.ng{color:#ff9a9a}.tag{display:inline-block;background:#263752;border-radius:99px;padding:4px 9px;margin:3px;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #30415b;padding:8px 0;margin-top:8px}.bar{height:8px;background:#2a3a55;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#58e1b7}button{background:#5b8cff;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}#detail{margin-top:16px}.small{font-size:13px;color:#b9c9de}</style>
<main><h1>ProGen 推薦バランス検証ラボ</h1><p>代表的な10軸パターンで、上位候補の系統・3D比率・工数・ヴァンサバ偏りを確認する。</p><div class="grid" id="cases"></div><div class="card" id="detail">テストを選択してください。</div></main>
<script>
const tests=[
 {n:'移動・反射',a:'移動 反射',r:['3D障害物ラン','レース・配達','横スクロールアクション','3Dコイン収集'],d:3,v:0,h:16},
 {n:'戦闘・反射',a:'戦闘 反射',r:['3D戦車アリーナ','ロボ防衛戦','見下ろしシューティング','格闘アクション'],d:3,v:0,h:18},
 {n:'探索・物語',a:'探索 物語',r:['廃墟探索','ダンジョン宝探し','都市伝説調査','ノベル探索'],d:2,v:0,h:17},
 {n:'管理・創造',a:'管理 創造',r:['カフェ運営','街づくり','工場ライン','カード編成'],d:1,v:0,h:15},
 {n:'成長・収集',a:'成長 収集',r:['ペット育成','森の収集探索','宝箱ハント','ヴァンサバ系'],d:2,v:1,h:17}
];
const el=document.getElementById('cases'),detail=document.getElementById('detail');
function verdict(t){const p=[];if(t.v>=2)p.push('ヴァンサバ偏り');if(t.d<2&&/移動|戦闘|探索/.test(t.a))p.push('3D案不足');if(t.h>18)p.push('工数超過');return p}
tests.forEach((t,i)=>{const b=document.createElement('button');const p=verdict(t);b.className='card';b.innerHTML='<b>'+t.n+'</b><div class="small">'+t.a+'</div><div class="row"><span>3D案</span><span>'+t.d+' / 4</span></div><div class="bar"><i style="width:'+(t.d*25)+'%"></i></div><div class="small '+(p.length?'ng':'ok')+'">'+(p.length?p.join('・'):'合格')+'</div>';b.onclick=()=>show(i);el.appendChild(b)});
function show(i){const t=tests[i],p=verdict(t);detail.innerHTML='<h2>'+t.n+'</h2><div>'+t.r.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div><div class="row"><span>3D候補</span><b>'+t.d+' / 4</b></div><div class="row"><span>最大工数</span><b>約'+t.h+'時間</b></div><div class="row"><span>判定</span><b class="'+(p.length?'ng':'ok')+'">'+(p.length?p.join('・'):'合格')+'</b></div><p class="small">不合格の場合は 8_推薦ルール の多様性・3D優先・ヴァンサバ抑制の値を調整する。</p>'}
</script></html>
