<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProGen 推薦バランス検証ラボ</title>
<style>body{margin:0;background:#101827;color:#edf4ff;font-family:system-ui,'Yu Gothic',sans-serif}main{max-width:1120px;margin:auto;padding:28px}h1{margin:0 0 8px}p{color:#b9c9de}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#182337;border:1px solid #31435e;border-radius:16px;padding:18px}.ok{color:#58e1b7}.ng{color:#ff9a9a}.tag{display:inline-block;background:#263752;border-radius:99px;padding:4px 9px;margin:3px;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #30415b;padding:8px 0;margin-top:8px}.small{font-size:13px;color:#b9c9de}button{background:#5b8cff;color:white;border:0;border-radius:10px;padding:12px;text-align:left;font-weight:700;cursor:pointer}button:hover{background:#729cff}#detail{margin-top:16px}.status{padding:8px 12px;border-radius:8px;background:#263752;display:inline-block}iframe{display:none}</style>
<main><h1>ProGen 推薦バランス検証ラボ</h1><p>診断ツール本体の推薦計算をそのまま呼び出し、代表的な10軸パターンで候補の偏りを確認する。</p><p class="status" id="status">診断ツール本体を読み込み中…</p><div class="grid" id="cases"></div><div class="card" id="detail">本体の読込後にテストを選べます。</div><iframe id="engine" title="推薦計算エンジン" src="../"></iframe></main>
<script>
const tests=[
 {n:'移動・反射',a:'3Dを含む移動アクションを確認',scores:[5,1,1,2,2,5,1,1,0,0],profile:{d3:'高',oc:'◎'},goal:'web',exp:'made'},
 {n:'戦闘・反射',a:'戦闘偏重と3D案を確認',scores:[3,1,2,1,5,5,2,1,0,1],profile:{d3:'高',oc:'○'},goal:'web',exp:'touch'},
 {n:'探索・物語',a:'探索系の多様性を確認',scores:[2,2,1,5,1,2,3,1,0,5],profile:{d3:'中',oc:'◎'},goal:'web',exp:'made'},
 {n:'管理・創造',a:'非アクション案を確認',scores:[1,2,2,1,0,2,3,5,5,1],profile:{d3:'低',oc:'○'},goal:'web',exp:'none'},
 {n:'成長・収集',a:'ヴァンサバ偏りを確認',scores:[2,5,5,2,3,3,2,1,1,1],profile:{d3:'中',oc:'○'},goal:'web',exp:'made'}
];
const el=document.getElementById('cases'),detail=document.getElementById('detail'),statusEl=document.getElementById('status'),frame=document.getElementById('engine');let api=null,last=[];
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function countBy(rows,key){return rows.reduce((m,x)=>(m[x[key]]=(m[x[key]]||0)+1,m),{})}
function issues(rows){const family=countBy(rows,'family'),view=countBy(rows,'view'),dim=countBy(rows,'dimension'),v=rows.filter(x=>/ヴァンサバ|サバイバル/.test(x.name+' '+x.family)).length;const p=[];if(Math.max(...Object.values(family))>2)p.push('同系統が3件以上');if(Math.max(...Object.values(view))>2)p.push('同視点が3件以上');if(Math.max(...Object.values(dim))>3)p.push('同次元が4件以上');if(v>1)p.push('ヴァンサバが2件以上');return p}
function renderCards(){el.innerHTML='';tests.forEach((t,i)=>{const r=api.recommend({...t,skills:{}}),rows=r.safe,p=issues(rows),b=document.createElement('button');b.className='card';b.innerHTML='<b>'+t.n+'</b><div class="small">'+t.a+'</div><div class="row"><span>安全圏候補</span><span>'+rows.length+'件</span></div><div class="small '+(p.length?'ng':'ok')+'">'+(p.length?p.join('・'):'偏り上限内')+'</div>';b.onclick=()=>show(i);el.appendChild(b)});show(0)}
function show(i){const t=tests[i],r=api.recommend({...t,skills:{}}),rows=r.safe,p=issues(rows),names=rows.map(x=>'<span class="tag">'+escapeHtml(x.name)+' <small>'+x.dimension+'</small></span>').join('');detail.innerHTML='<h2>'+t.n+'</h2><p class="small">主軸：'+r.tops.map(x=>escapeHtml(x.a)).join('・')+'</p><div>'+names+'</div><div class="row"><span>系統</span><b>'+escapeHtml(Object.entries(countBy(rows,'family')).map(x=>x[0]+' '+x[1]).join('／'))+'</b></div><div class="row"><span>視点</span><b>'+escapeHtml(Object.entries(countBy(rows,'view')).map(x=>x[0]+' '+x[1]).join('／'))+'</b></div><div class="row"><span>次元</span><b>'+escapeHtml(Object.entries(countBy(rows,'dimension')).map(x=>x[0]+' '+x[1]).join('／'))+'</b></div><div class="row"><span>判定</span><b class="'+(p.length?'ng':'ok')+'">'+(p.length?p.join('・'):'偏り上限内')+'</b></div><p class="small">この結果は診断ツール本体の <code>recommendationLists()</code> を使用。</p>'}
function connect(){try{api=frame.contentWindow.ProGenRecommendationAPI;if(!api)throw Error('API待ち');statusEl.textContent='診断ツール本体と接続済み（Ver '+api.version+'）';statusEl.className='status ok';renderCards()}catch(e){setTimeout(connect,250)}}
frame.addEventListener('load',connect);
</script></html>
