<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProGen 3Dモデル検証ラボ</title><style>
:root{--ink:#0b1530;--bg:#eef3fb;--line:#cfdbec;--key:#4f46e5;--mint:#d9f9eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Meiryo,system-ui,sans-serif}.app{max-width:1280px;margin:auto;padding:14px}header{display:flex;align-items:baseline;justify-content:space-between;gap:14px}h1{font-size:22px;margin:0}header p{margin:0;color:#64748b;font-size:13px}.bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}.themes{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.theme{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 11px;font-weight:bold;cursor:pointer;color:#30405e}.theme.on{background:#e9e9ff;border-color:var(--key);color:#3730a3}.stage{position:relative;margin-top:10px;height:min(68vh,690px);min-height:440px;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 18%,#456592,#0d1528 70%);box-shadow:0 10px 28px #1e335829}#view{width:100%;height:100%;display:block}.title{position:absolute;left:16px;top:14px;color:#fff;text-shadow:0 2px 4px #0008}.title b{font-size:18px}.title small{display:block;margin-top:4px;color:#c8dcff}.tag{position:absolute;border:1px solid #ffffff44;background:#0b1530cc;color:#fff;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:bold}.hp{left:16px;bottom:16px;color:#fde68a}.timer{left:50%;top:16px;transform:translateX(-50%)}.score{right:16px;top:16px}.radar{right:16px;bottom:16px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#5eead4;text-align:center}.hidden{display:none}.control{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.label{font-size:12px;font-weight:bold;color:#64748b;margin-right:2px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;font-weight:bold;cursor:pointer;color:#263651}.btn.on{border-color:var(--key);background:#eeefff;color:#3730a3}.btn.copy{margin-left:auto;background:var(--key);color:#fff;border-color:var(--key)}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.range{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:bold;color:#52627d}.range input{accent-color:var(--key);width:100px}.prompt{display:none;margin-top:10px}.prompt.open{display:block}.prompt textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:10px;background:#0d172a;color:#e7f0ff;padding:10px;font:12px/1.5 ui-monospace,monospace;resize:vertical}.tip{background:var(--mint);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.5;color:#16543d}@media(max-width:680px){.app{padding:9px}header{display:block}header p{margin-top:4px}.stage{min-height:390px;height:58vh}.bar{border-radius:11px}.btn.copy{margin-left:0;width:100%}.timer{top:60px}.range input{width:82px}}
</style></head><body><main class="app"><header><h1>ProGen 3Dモデル検証ラボ</h1><p>ゲーム画面の中で、主役・敵・障害物が見えるかを確認する。</p></header><section class="bar"><div class="themes" id="themes"></div></section><section class="stage"><canvas id="view"></canvas><div class="title"><b id="title">ロボ・工場</b><small id="role">主役・敵・障害物を一画面で確認</small></div><div class="tag hp" data-ui="hp">HP ●●●</div><div class="tag timer" data-ui="timer">残り 01:00</div><div class="tag score" data-ui="score">SCORE 0120</div><div class="tag radar" data-ui="radar">RADAR<br>●　▲</div></section><section class="bar control"><span class="label">カメラ</span><button class="btn cam on" data-cam="standard">標準</button><button class="btn cam" data-cam="close">近い</button><button class="btn cam" data-cam="bird">斜め後方俯瞰</button><span class="label">UI</span><button class="btn ui on" data-toggle="hp">HP</button><button class="btn ui on" data-toggle="timer">時間</button><button class="btn ui on" data-toggle="score">スコア</button><button class="btn ui on" data-toggle="radar">レーダー</button><span class="range">モデルサイズ <input id="scale" type="range" min=".7" max="1.5" step=".05" value="1"><b id="scaleV">1.0</b></span><button class="btn" id="spec">生成用指示を表示</button><button class="btn copy" id="copy">指示をコピー</button></section><section class="prompt" id="prompt"><div class="tip">この文をProGenの「Webプロト生成プロンプト」の末尾へ追加する。</div><textarea id="text" readonly></textarea></section></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const DATA={robot:['ロボ・工場','ロボット＝箱胴体＋円柱手足＋球関節＋発光目。敵ドローン＝球核＋円柱アーム。障害物＝工場機械。','robot'],fish:['海・釣り','魚＝球胴体＋円錐尾びれ。敵＝大型魚。障害物＝岩・桟橋。','fish'],tank:['戦車・基地','戦車＝箱車体＋円柱砲塔＋細い円柱砲身＋球車輪。敵＝砲台。','tank'],car:['レース・配達','車＝箱車体＋円柱車輪＋板窓。敵＝ライバル車。','car'],space:['宇宙・SF','宇宙船＝箱コックピット＋円錐ノーズ＋円柱エンジン。敵＝戦闘機。','ship'],fantasy:['ファンタジー','勇者＝球頭＋箱胴体＋円柱手足＋板の剣。敵＝角魔物。','robot'],horror:['ホラー・廃墟','探索者＝球頭＋箱胴体＋円柱ライト。敵＝怪異。','robot'],school:['学校・日常','生徒＝球頭＋箱胴体＋円柱手足。敵＝ライバル。','robot'],animal:['動物・ペット','犬・猫＝球頭＋箱胴体＋円柱脚＋円錐耳。','fish'],ninja:['忍者・侍','忍者＝球頭＋箱胴体＋円柱手足＋板の刀。敵＝侍。','robot'],dinosaur:['恐竜・怪獣','恐竜＝球胴体＋円錐尾＋円柱脚＋球頭。','fish'],dungeon:['ダンジョン・宝探し','探検家＝球頭＋箱胴体＋円柱ライト。敵＝スライム。','robot'],sports:['スポーツ','選手＝球頭＋箱胴体＋円柱手足。敵＝対戦選手。','robot'],sweets:['お菓子・料理','コック＝球頭＋箱胴体＋円柱帽子。敵＝暴走お菓子。','robot'],rescue:['救助・病院','救助隊員＝球頭＋箱胴体＋円柱ヘルメット。障害物＝瓦礫。','car'],forest:['森・自然・昆虫','昆虫＝球胴体＋円柱脚＋薄い羽。敵＝クモ・ハチ。','fish'],idol:['アイドル・ライブ','アイドル＝球頭＋箱胴体＋円柱手足＋板スカート。','robot'],cyber:['サイバー都市','ランナー＝球頭＋箱胴体＋円柱手足＋発光帯。敵＝警備ドローン。','ship']};
const ASSET_BASE='https://odatid.github.io/ProGenWork/assets/kenney/';
const ASSETS={robot:['factory/oopi.glb','factory/robot-arm-a.glb','factory/conveyor.glb'],fish:['pets/animal-fish.glb','dungeon/barrel.glb','forest/rocks-high.glb'],tank:['vehicles/tractor-shovel.glb','city/detail-tank.glb','city/building-a.glb'],car:['vehicles/race.glb','vehicles/delivery.glb','vehicles/cone.glb'],space:['space/room-large.glb','space/gate-lasers.glb','space/cables.glb'],fantasy:['dungeon/character-human.glb','dungeon/character-orc.glb','dungeon/chest.glb'],horror:['dungeon/character-human.glb','dungeon/gate.glb','dungeon/wall.glb'],school:['dungeon/character-human.glb','city/building-e.glb','factory/box-large.glb'],animal:['pets/animal-dog.glb','pets/animal-cat.glb','pets/animal-fox.glb'],ninja:['dungeon/character-human.glb','dungeon/character-orc.glb','dungeon/gate.glb'],dinosaur:['pets/animal-fox.glb','forest/tree.glb','forest/rocks-high.glb'],dungeon:['dungeon/character-human.glb','dungeon/character-orc.glb','dungeon/chest.glb'],sports:['dungeon/character-human.glb','vehicles/cone.glb','factory/box-large.glb'],sweets:['pets/animal-bunny.glb','dungeon/barrel.glb','factory/box-large.glb'],rescue:['vehicles/ambulance.glb','vehicles/tractor-shovel.glb','city/building-a.glb'],forest:['forest/character-archer.glb','forest/tree.glb','forest/tent.glb'],idol:['dungeon/character-human.glb','factory/screen-wide.glb','factory/box-large.glb'],cyber:['vehicles/race-future.glb','city/building-m.glb','factory/machine.glb']};
let id='robot',cam='standard',size=1,ui={hp:1,timer:1,score:1,radar:1},loadVersion=0;const loader=new GLTFLoader(),themes=document.querySelector('#themes');Object.entries(DATA).forEach(([k,v])=>{const b=document.createElement('button');b.className='theme'+(k===id?' on':'');b.dataset.id=k;b.textContent=v[0];themes.append(b)});
const canvas=document.querySelector('#view'),r=new THREE.WebGLRenderer({canvas,antialias:true}),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,100),world=new THREE.Group();r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;scene.add(world,new THREE.HemisphereLight(0xb8e1ff,0x172035,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(8,13,8);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x1c2c48,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor,new THREE.GridHelper(70,32,0x5276a5,0x253a58));const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.18,emissive:c,emissiveIntensity:.05});function add(g,m,x,y,z,rx=0,rz=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.rotation.x=rx;o.rotation.z=rz;o.castShadow=o.receiveShadow=true;world.add(o);return o}function box(x,y,z,m,a,b,c){return add(new THREE.BoxGeometry(x,y,z),m,a,b,c)}function ball(x,y,z,m,s=.5){return add(new THREE.SphereGeometry(s,18,12),m,x,y,z)}function cyl(x,y,z,m,rad=.25,h=1,rx=0,rz=0){return add(new THREE.CylinderGeometry(rad,rad,h,14),m,x,y,z,rx,rz)}function cone(x,y,z,m,rad=.45,h=1,rx=0,rz=0){return add(new THREE.ConeGeometry(rad,h,14),m,x,y,z,rx,rz)}function clear(){while(world.children.length)world.remove(world.children[0])}function humanoid(x,z,c){const m=M(c),d=M(0x1c2942);box(1.35,1.25,.75,m,x,2,z);ball(x,3.15,z,m,.58);[-.85,.85].forEach(a=>cyl(x+a,1.7,z,d,.16,1.4));[-.38,.38].forEach(a=>cyl(x+a,.45,z,d,.22,1.45))}function fish(x,z,c){const m=M(c);ball(x,2,z,m,1);cone(x-1.2,2,z,m,.58,1.25,0,Math.PI/2);cone(x,2.8,z,m,.26,.75)}function tank(x,z,c){const m=M(c),d=M(0x21311c);box(2.6,.75,1.5,m,x,.8,z);cyl(x,1.45,z,m,.68,.5,0,Math.PI/2);cyl(x+1.25,1.45,z,d,.11,1.8,0,Math.PI/2);[-.9,.9].forEach(a=>[-.62,.62].forEach(b=>ball(x+a,.42,z+b,d,.31)))}function car(x,z,c){const m=M(c),d=M(0x192233);box(2.6,.65,1.45,m,x,.75,z);box(1.25,.55,1.2,m,x-.18,1.32,z);[-.85,.85].forEach(a=>[-.72,.72].forEach(b=>cyl(x+a,.4,z+b,d,.32,.25,0,Math.PI/2)))}function ship(x,z,c){const m=M(c);box(1.5,.6,1.35,m,x,1.7,z);cone(x+1.45,1.7,z,m,.62,1.6,0,Math.PI/2);cyl(x-1.05,1.7,z,M(0x67e8f9),.3,.7,0,Math.PI/2)}function buildPrimitive(){clear();const type=DATA[id][2],fn={robot:humanoid,fish,tank,car,ship}[type],cols=[0x60a5fa,0xfb7185,0xfbbf24];fn(0,0,cols[0]);fn(-4,-2,cols[1]);if(type==='fish')ball(4,.6,-1,M(cols[2]),.9);else if(type==='tank')box(1.2,1.2,1.2,M(cols[2]),4,.6,-1);else if(type==='car')cone(4,.55,-1,M(cols[2]),.35,1.1);else box(1.2,1.2,1.2,M(cols[2]),4,.6,-1);world.scale.setScalar(size);document.querySelector('#title').textContent=DATA[id][0];document.querySelector('#role').textContent='青：主役　赤：敵　黄：障害物';setTextPrimitive()}function setCamera(){const p={close:[7,4.5,10],standard:[12,7,15],bird:[0,12,20]}[cam];camera.position.set(...p);camera.lookAt(0,.8,-3)}function setTextPrimitive(){const c={standard:'主役・敵・障害物が同時に見える標準距離',close:'主役を大きく見せる近距離',bird:'プレイヤーの斜め後方かつ高い位置から、進行方向と周囲を見渡す三人称俯瞰'}[cam],us=Object.entries(ui).filter(x=>x[1]).map(x=>({hp:'HP',timer:'タイマー',score:'スコア',radar:'レーダー'}[x[0]]));document.querySelector('#text').value=`【3Dモデル・カメラ指定】\n題材：${DATA[id][0]}\n${DATA[id][1]}\nカメラ：${c}。\n必須：主役・敵・障害物を立体として判別できる大きさにする。2D板・ビルボードのみで代用しない。床、影、光、遠近感を入れる。\nUI：${us.join('、')||'なし'}。`}
function fitModel(o,x,z,target=3){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),k=target/Math.max(s.x,s.y,s.z,.01);o.scale.multiplyScalar(k);const b2=new THREE.Box3().setFromObject(o),c=b2.getCenter(new THREE.Vector3());o.position.set(x-c.x,-b2.min.y,z-c.z);o.traverse(n=>{if(n.isMesh){n.castShadow=n.receiveShadow=true}});world.add(o)}async function loadAssets(version){const paths=ASSETS[id]||[];if(!paths.length)return;try{const loaded=await Promise.all(paths.map(p=>loader.loadAsync(ASSET_BASE+p)));if(version!==loadVersion)return;clear();const pos=[[-2.8,0,3.1],[0,-2.4,2.7],[3.7,-1.1,2.4]];loaded.forEach((g,i)=>fitModel(g.scene,...pos[i]));world.scale.setScalar(size);document.querySelector('#role').textContent='Kenney CC0：主役・敵・障害物の実モデル'}catch(e){if(version===loadVersion)document.querySelector('#role').textContent='実モデルを読込中または未配置：立体代替モデルを表示'}}function build(){const version=++loadVersion;buildPrimitive();world.scale.setScalar(size);document.querySelector('#title').textContent=DATA[id][0];document.querySelector('#role').textContent='実モデルを読み込み中…（失敗時は立体代替モデル）';setText();loadAssets(version)}function setText(){const c={standard:'主役・敵・障害物が同時に見える標準距離',close:'主役を大きく見せる近距離',bird:'プレイヤーの斜め後方かつ高い位置から、進行方向と周囲を見渡す三人称俯瞰'}[cam],us=Object.entries(ui).filter(x=>x[1]).map(x=>({hp:'HP',timer:'タイマー',score:'スコア',radar:'レーダー'}[x[0]])),urls=(ASSETS[id]||[]).map(p=>ASSET_BASE+p);document.querySelector('#text').value=`【3Dモデル・カメラ指定】\n題材：${DATA[id][0]}\n${DATA[id][1]}\nカメラ：${c}。\n必須：主役・敵・障害物を立体として判別できる大きさにする。2D板・ビルボードのみで代用しない。床、影、光、遠近感を入れる。\nUI：${us.join('、')||'なし'}。\n\n【使用可：Kenney CC0の実モデルURL】\n${urls.join('\\n')}\nこれ以外のURLは検索・推測・創作しない。読込失敗時は、キューブ・球・円柱・円錐を組んだ立体代替モデルを使う。`}document.addEventListener('click',e=>{let b=e.target.closest('.theme');if(b){id=b.dataset.id;document.querySelectorAll('.theme').forEach(x=>x.classList.toggle('on',x===b));build()}b=e.target.closest('.cam');if(b){cam=b.dataset.cam;document.querySelectorAll('.cam').forEach(x=>x.classList.toggle('on',x===b));setCamera();setText()}b=e.target.closest('.ui');if(b){const k=b.dataset.toggle;ui[k]=!ui[k];b.classList.toggle('on',!!ui[k]);document.querySelector(`[data-ui="${k}"]`).classList.toggle('hidden',!ui[k]);setText()}if(e.target.id==='spec')document.querySelector('#prompt').classList.toggle('open')});document.querySelector('#scale').oninput=e=>{size=+e.target.value;document.querySelector('#scaleV').textContent=size.toFixed(2);build()};document.querySelector('#copy').onclick=async()=>{const t=document.querySelector('#text');let ok=false;try{if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(t.value);ok=true}}catch(e){}if(!ok){t.select();ok=document.execCommand('copy')}const b=document.querySelector('#copy');b.textContent=ok?'コピー完了':'テキストを選択済み';setTimeout(()=>b.textContent='指示をコピー',1200)};function resize(){const q=canvas.getBoundingClientRect();r.setSize(q.width,q.height,false);camera.aspect=q.width/q.height;camera.updateProjectionMatrix()}let turn=0;function loop(){resize();turn+=.003;world.rotation.y=turn;r.render(scene,camera);requestAnimationFrame(loop)}build();setCamera();loop();
</script></body></html>
