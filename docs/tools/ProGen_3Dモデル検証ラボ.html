<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProGen 3Dモデル検証ラボ</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<style>
:root{--ink:#0e1830;--line:#dce5f3;--a:#4f46e5;--mint:#dff8ed;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:#f5f8fd;color:var(--ink);font-family:Meiryo,system-ui,sans-serif}header{padding:22px max(20px,calc((100% - 1240px)/2));background:#fff;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px}header p{margin:7px 0 0;color:#52617a}.app{max-width:1240px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 18px #24396b0a}.card h2{font-size:15px;margin:0 0 12px}.presets{display:grid;gap:8px}.preset{cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;font-weight:700;color:var(--ink)}.preset small{display:block;color:#64748b;font-weight:400;margin-top:3px}.preset.on{border-color:var(--a);background:#eef2ff;color:#3730a3}.view{padding:0;overflow:hidden;min-height:630px;position:relative;background:radial-gradient(circle at 50% 20%,#35517d,#111a2d 65%)}#stage{width:100%;height:550px;display:block}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#ffffffdd;border:1px solid #fff;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700}.ui{position:absolute;inset:0;pointer-events:none}.hp,.timer,.score,.radar{position:absolute;background:#0f1930d9;color:white;border:1px solid #ffffff42;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:bold}.hp{left:14px;bottom:15px;color:#fef08a}.timer{top:50px;left:50%;transform:translateX(-50%)}.score{right:14px;top:52px}.radar{right:14px;bottom:15px;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#5eead4}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;background:#fff;border-top:1px solid var(--line)}button{font:inherit}.tool{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}.tool.on{background:#eef2ff;border-color:#818cf8;color:#3730a3}.range label{display:flex;justify-content:space-between;font-size:12px;color:#475569;margin:12px 0 4px}.range input{width:100%}.checks{display:grid;gap:8px}.check{font-size:13px;padding:8px;background:#f8fafc;border-radius:8px}.check input{margin-right:6px}.status{background:var(--mint);border-radius:10px;padding:10px;font-size:13px;line-height:1.6}.output{width:100%;height:210px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#10192b;color:#e5efff;font:12px/1.55 ui-monospace,monospace;resize:vertical}.copy{margin-top:8px;width:100%;background:var(--a);border:0;color:white;border-radius:9px;padding:10px;font-weight:bold;cursor:pointer}.note{font-size:12px;color:#64748b;line-height:1.55;margin:8px 0 0}.warn{color:#9a3412;background:#fff7ed;padding:8px;border-radius:8px;font-size:12px;line-height:1.5}@media(max-width:960px){.app{grid-template-columns:1fr}.view{order:-1;min-height:500px}#stage{height:420px}.card{border-radius:14px}}
</style></head>
<body><header><h1>ProGen 3Dモデル検証ラボ</h1><p>題材別の簡易ポリゴンモデル、カメラ、画面UIを先に検証し、Webプロト生成用の短い指示へ変換する。</p></header>
<main class="app"><aside class="card"><h2>題材セット</h2><div class="presets" id="presets"></div><div class="range"><label>モデルの大きさ <b id="sizeV">1.0</b></label><input id="size" type="range" min="0.65" max="1.55" step="0.05" value="1"><label>カメラの高さ <b id="heightV">7</b></label><input id="height" type="range" min="3" max="13" step="1" value="7"></div><p class="note">マウス／指で視点を回せる。ホイールで距離を確認。</p></aside>
<section class="card view"><canvas id="stage"></canvas><div class="hud"><span class="badge" id="nameBadge">ロボ・工場</span><span class="badge" id="cameraBadge">標準カメラ</span></div><div class="ui" id="gameUi"><div class="hp">HP ●●●</div><div class="timer">01:00</div><div class="score">SCORE 0120</div><div class="radar">RADAR<br>●　▲</div></div><div class="toolbar"><button class="tool camera on" data-cam="standard">標準</button><button class="tool camera" data-cam="close">近い</button><button class="tool camera" data-cam="bird">斜め後方俯瞰</button><button class="tool" id="reset">視点を戻す</button><button class="tool" id="spin">自動回転: ON</button></div></section>
<aside class="card"><h2>検証チェック</h2><div class="checks"><label class="check"><input type="checkbox" data-ui="hp" checked>主役のHP</label><label class="check"><input type="checkbox" data-ui="timer" checked>タイマー</label><label class="check"><input type="checkbox" data-ui="score" checked>スコア</label><label class="check"><input type="checkbox" data-ui="radar" checked>レーダー</label></div><h2 style="margin-top:18px">判定</h2><div class="status" id="status"></div><h2 style="margin-top:18px">生成AIへ渡す指示</h2><textarea class="output" id="output" readonly></textarea><button class="copy" id="copy">指示をコピー</button><p class="warn">外部3DモデルURLがDBに登録されるまでは、この検証ラボのポリゴン構成を使う。</p></aside></main>
<script>
const SETS={
 robot:{name:'ロボ・工場',sub:'箱胴体＋円柱手足＋球関節＋発光目',roles:'主役:ロボット / 敵:ドローン / 障害:工場機械',colors:[0x60a5fa,0xfb7185,0xfbbf24]},
 fish:{name:'海・釣り',sub:'魚＝球胴体＋円錐尾びれ。船＝箱船体＋円柱マスト＋三角帆',roles:'主役:魚 / 敵:大型魚 / 障害:岩・桟橋',colors:[0x38bdf8,0xf97316,0x94a3b8]},
 tank:{name:'戦車・基地',sub:'戦車＝箱車体＋円柱砲塔＋細い円柱砲身＋球車輪',roles:'主役:戦車 / 敵:砲台 / 障害:バリケード',colors:[0x84cc16,0xef4444,0x78716c]},
 car:{name:'レース・配達',sub:'車＝箱車体＋円柱車輪＋板窓。コーン＝円錐',roles:'主役:車 / 敵:ライバル車 / 障害:コーン・ゲート',colors:[0x8b5cf6,0xec4899,0xf97316]},
 space:{name:'宇宙・SF',sub:'宇宙船＝箱コックピット＋円錐ノーズ＋円柱エンジン',roles:'主役:宇宙船 / 敵:敵機 / 障害:隕石',colors:[0x22d3ee,0xf43f5e,0xa78bfa]}
};Object.assign(SETS,{fantasy:{name:'ファンタジー',base:'robot',sub:'勇者＝球頭＋箱胴体＋円柱手足＋板の剣。魔物＝球胴体＋円錐角',roles:'主役:勇者 / 敵:角魔物 / 障害:岩・柵',colors:[0x60a5fa,0xa855f7,0x78716c]},horror:{name:'ホラー・廃墟',base:'robot',sub:'探索者＝球頭＋箱胴体＋円柱手足＋円柱ライト。怪異＝球胴体＋円錐腕',roles:'主役:探索者 / 敵:怪異 / 障害:倒れた家具',colors:[0x94a3b8,0x7c3aed,0x57534e]},school:{name:'学校・日常',base:'robot',sub:'生徒＝球頭＋箱胴体＋円柱手足。机・椅子＝厚い箱と円柱',roles:'主役:生徒 / 敵:ライバル / 障害:机・椅子',colors:[0x60a5fa,0xfb7185,0x92400e]},animal:{name:'動物・ペット',base:'fish',sub:'犬・猫＝球頭＋箱胴体＋円柱脚＋円錐耳',roles:'主役:犬・猫 / 敵:いたずら動物 / 障害:ベンチ',colors:[0xf59e0b,0xef4444,0x84cc16]},ninja:{name:'忍者・侍',base:'robot',sub:'忍者＝球頭＋箱胴体＋円柱手足＋板の刀。侍＝円錐かぶと',roles:'主役:忍者 / 敵:侍 / 障害:竹柵',colors:[0x111827,0xdc2626,0x65a30d]},dinosaur:{name:'恐竜・怪獣',base:'fish',sub:'恐竜＝球胴体＋円錐尾＋円柱脚＋球頭',roles:'主役:恐竜 / 敵:小型怪獣 / 障害:岩山',colors:[0x65a30d,0xf97316,0x78716c]},dungeon:{name:'ダンジョン・宝探し',base:'robot',sub:'探検家＝球頭＋箱胴体＋円柱手足＋円柱ライト',roles:'主役:探検家 / 敵:スライム / 障害:柱・落石',colors:[0xfbbf24,0x22c55e,0x78716c]},sports:{name:'スポーツ',base:'robot',sub:'選手＝球頭＋箱胴体＋円柱手足。ボール＝球',roles:'主役:選手 / 敵:対戦選手 / 障害:コーン',colors:[0x2563eb,0xef4444,0xf59e0b]},sweets:{name:'お菓子・料理',base:'robot',sub:'コック＝球頭＋箱胴体＋円柱手足＋円柱帽子',roles:'主役:コック / 敵:暴走お菓子 / 障害:鍋',colors:[0xf472b6,0xf97316,0x94a3b8]},rescue:{name:'救助・病院',base:'car',sub:'救助隊員＝球頭＋箱胴体＋円柱手足＋円柱ヘルメット',roles:'主役:救助隊員 / 敵:火の玉・瓦礫 / 障害:倒木',colors:[0x0ea5e9,0xef4444,0x92400e]},forest:{name:'森・自然・昆虫',base:'fish',sub:'昆虫＝球胴体＋球頭＋円柱脚＋薄い羽',roles:'主役:昆虫 / 敵:クモ・ハチ / 障害:きのこ',colors:[0x22c55e,0xeab308,0xa16207]},idol:{name:'アイドル・ライブ',base:'robot',sub:'アイドル＝球頭＋箱胴体＋円柱手足＋板スカート',roles:'主役:アイドル / 敵:ライバル / 障害:スピーカー',colors:[0xec4899,0x8b5cf6,0x475569]},cyber:{name:'サイバー都市',base:'space',sub:'ランナー＝球頭＋箱胴体＋円柱手足＋発光帯。ドローン＝球核＋円柱アーム',roles:'主役:ランナー / 敵:警備ドローン / 障害:ネオン障害物',colors:[0x06b6d4,0xf43f5e,0x8b5cf6]}});let selected='robot',spin=true,scale=1,camMode='standard';
const presets=document.querySelector('#presets');Object.entries(SETS).forEach(([id,s])=>{const b=document.createElement('button');b.className='preset'+(id===selected?' on':'');b.dataset.id=id;b.innerHTML=`${s.name}<small>${s.roles}</small>`;presets.append(b)});
const canvas=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({canvas,antialias:true}),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,100),world=new THREE.Group();scene.add(world);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;scene.fog=new THREE.Fog(0x111a2d,18,43);
const amb=new THREE.HemisphereLight(0xaed9ff,0x172033,2);scene.add(amb);const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(7,12,5);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x1b2a45,roughness:.9,metalness:.05}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(60,30,0x476a98,0x263d5b);scene.add(grid);
function mat(c,em=0){return new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.2,emissive:em?c:0x000000,emissiveIntensity:em?.35:0})}function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;world.add(o);return o}function box(x,y,z,m,a,b,c){return mesh(new THREE.BoxGeometry(x,y,z),m,a,b,c)}function sph(r,m,a,b,c){return mesh(new THREE.SphereGeometry(r,20,14),m,a,b,c)}function cyl(r1,r2,h,m,a,b,c,rx=0,rz=0){const o=mesh(new THREE.CylinderGeometry(r1,r2,h,16),m,a,b,c);o.rotation.x=rx;o.rotation.z=rz;return o}function cone(r,h,m,a,b,c,rx=0,rz=0){const o=mesh(new THREE.ConeGeometry(r,h,16),m,a,b,c);o.rotation.x=rx;o.rotation.z=rz;return o}
function clear(){while(world.children.length)world.remove(world.children[0])}function robot(c){const m=mat(c),dark=mat(0x23314c),glow=mat(0x7dd3fc,1);box(2.1,1.6,1.1,m,0,2,0);sph(.72,m,0,3.4,0);cyl(.22,.22,1.5,dark,-1.2,1.45,0,0,0);cyl(.22,.22,1.5,dark,1.2,1.45,0,0,0);cyl(.28,.28,1.4,dark,-.65,.2,0,0,0);cyl(.28,.28,1.4,dark,.65,.2,0,0,0);sph(.16,glow,-.25,3.45,.65);sph(.16,glow,.25,3.45,.65)}function fish(c){const m=mat(c),glow=mat(0xffffff,1);sph(1.1,m,0,2,0);cone(.65,1.35,m,-1.25,2,0,0,Math.PI/2);cone(.3,.8,m,0,2.9,0,0,0);sph(.14,glow,.7,2.25,.82)}function tank(c){const m=mat(c),dark=mat(0x22301a);box(2.7,.75,1.7,m,0,.8,0);cyl(.75,.75,.55,m,0,1.45,0,0,Math.PI/2);cyl(.14,.14,2.3,dark,1.35,1.45,0,0,Math.PI/2);[-.9,.9].forEach(x=>[-.75,.75].forEach(z=>sph(.35,dark,x,.45,z)))}function car(c){const m=mat(c),dark=mat(0x172033);box(2.8,.6,1.5,m,0,.75,0);box(1.35,.55,1.3,m,-.2,1.32,0);[-.9,.9].forEach(x=>[-.76,.76].forEach(z=>cyl(.38,.38,.22,dark,x,.42,z,0,Math.PI/2)))}function ship(c){const m=mat(c),g=mat(0x67e8f9,1);box(1.7,.65,1.45,m,0,1.8,0);cone(.72,1.8,m,1.6,1.8,0,0,Math.PI/2);cyl(.3,.42,.75,g,-1.25,1.8,0,0,Math.PI/2);}
function obstacle(c,id){if(id==='fish'){sph(.95,mat(c),4,.9,-1);sph(.6,mat(c),3.5,.5,-.2)}else if(id==='car'){cone(.36,1.1,mat(c),4,.55,-1)}else if(id==='space'){sph(1,mat(c),4,1,-1)}else{box(1.2,1.2,1.2,mat(c),4,.6,-1);cyl(.35,.35,1.8,mat(c),3.2,.9,-1)}}function enemy(c,id){const g=new THREE.Group();world.add(g);if(id==='fish'){sph(.75,mat(c),-4,1.6,-2);cone(.42,.9,mat(c),-4.85,1.6,-2,0,Math.PI/2)}else if(id==='tank'){cyl(.65,.65,.5,mat(c),-4,.8,-2);cyl(.1,.1,1.5,mat(c),-3.25,1,-2,0,Math.PI/2)}else if(id==='robot'){sph(.6,mat(c),-4,2,-2);[-.6,.6].forEach(x=>cyl(.08,.08,1.1,mat(c),-4+x,2,-2,0,0))}else if(id==='car'){car(c);world.children[world.children.length-1].position.x=-4}else ship(c)}
function build(){clear();const s=SETS[selected],kind=s.base||selected;({robot:robot,fish:fish,tank:tank,car:car,space:ship}[kind])(s.colors[0]);enemy(s.colors[1],kind);obstacle(s.colors[2],kind);world.scale.setScalar(scale);updateOutput()}function cameraPreset(){const h=Number(document.querySelector('#height').value),p={close:[8,h*.55,10],standard:[12,h,15],bird:[0,h*1.7,20]}[camMode];camera.position.set(...p);camera.lookAt(0,.8,-3.2);document.querySelector('#cameraBadge').textContent={close:'近いカメラ',standard:'標準カメラ',bird:'斜め後方俯瞰カメラ'}[camMode]}
function updateOutput(){const s=SETS[selected],h=document.querySelector('#height').value;document.querySelector('#nameBadge').textContent=s.name;const text=`【3Dモデル・カメラ指定】\n題材：${s.name}\n${s.roles}\n主役モデル：${s.sub}\nモデルの表示倍率：${scale.toFixed(2)}\nカメラ：${{close:'主役を大きく見せる近距離',standard:'主役・敵・障害物が同時に見える標準距離',bird:'高い位置から先を見渡す俯瞰'}[camMode]}。高さは約${h}。\n必須：主役・敵・障害物を立体として判別できる大きさにする。2D板・ビルボードのみで代用しない。床、影、光、遠近感を入れる。\nUI：${[...document.querySelectorAll('[data-ui]:checked')].map(x=>x.parentNode.textContent.trim()).join('、')||'なし'}。`;document.querySelector('#output').value=text;const p=camMode==='close'?'主役が大きく見える':camMode==='bird'?'遠くまで見渡せる':'主役・敵・障害物の関係が読める';document.querySelector('#status').innerHTML=`<b>現在の判定：OK</b><br>${p}。主役・敵・障害物を色分けして確認できる。`}
document.addEventListener('click',e=>{const p=e.target.closest('.preset');if(p){selected=p.dataset.id;document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('on',x===p));build()}const c=e.target.closest('.camera');if(c){camMode=c.dataset.cam;document.querySelectorAll('.camera').forEach(x=>x.classList.toggle('on',x===c));cameraPreset();updateOutput()}if(e.target.id==='spin'){spin=!spin;e.target.textContent='自動回転: '+(spin?'ON':'OFF')}if(e.target.id==='reset'){cameraPreset()}});document.querySelectorAll('[data-ui]').forEach(x=>x.onchange=updateOutput);document.querySelector('#size').oninput=e=>{scale=Number(e.target.value);document.querySelector('#sizeV').textContent=scale.toFixed(2);build()};document.querySelector('#height').oninput=e=>{document.querySelector('#heightV').textContent=e.target.value;cameraPreset();updateOutput()};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('#output').value);document.querySelector('#copy').textContent='コピー完了';setTimeout(()=>document.querySelector('#copy').textContent='指示をコピー',1200)};
let drag=false,px=0,py=0,yaw=0,pitch=0;canvas.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-px)*.008;pitch=Math.max(-.45,Math.min(.35,pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY};canvas.onpointerup=()=>drag=false;canvas.onwheel=e=>{camera.position.multiplyScalar(e.deltaY>0?1.08:.93);e.preventDefault()};function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}function tick(){resize();if(spin&&!drag)world.rotation.y+=.004;world.rotation.x=pitch;world.rotation.y+=yaw*0;renderer.render(scene,camera);requestAnimationFrame(tick)}build();cameraPreset();tick();
</script><script>
const baseUpdateOutput=updateOutput;
updateOutput=function(){baseUpdateOutput();if(camMode==='bird'){const out=document.querySelector('#output');out.value=out.value.replace('高い位置から先を見渡す俯瞰','プレイヤーの斜め後方かつ高い位置から、進行方向と周囲を見渡す三人称俯瞰');document.querySelector('#status').innerHTML='<b>現在の判定：OK</b><br>斜め後方から進行方向と周囲を見渡せる。主役・敵・障害物を色分けして確認できる。'}};
document.querySelector('#copy').onclick=async()=>{const out=document.querySelector('#output');let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(out.value);ok=true}}catch(e){}if(!ok){out.focus();out.select();ok=document.execCommand('copy')}const b=document.querySelector('#copy');b.textContent=ok?'コピー完了':'テキストを選択済み';setTimeout(()=>b.textContent='指示をコピー',1200)};
updateOutput();
</script></body></html>
